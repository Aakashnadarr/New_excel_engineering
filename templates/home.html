{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW EXCEL ENGINEERING - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>

<body>
    <header class="flex flex-col items-center mb-12 text-center">
        <div class="bg-white p-4 rounded-full shadow-sm mb-6">
            <img src="{% static 'logo/nee_logo.png' %}" alt="New Excel Engineering Logo"
                class="h-24 w-auto object-contain">
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight uppercase">New Excel Engineering
        </h1>
        <div class="h-1 w-24 bg-blue-600 mt-4 rounded-full"></div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-5xl">
        <a href="{% url 'email' %}"
            class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 hover:border-blue-500 transition-all duration-300 flex flex-col items-center group">
            <span class="text-4xl mb-4 group-hover:scale-110 transition-transform">✉️</span>
            <span class="font-bold text-slate-700 group-hover:text-blue-600">Mail Hub</span>
        </a>

        <a href="{% url 'tax_invoice' %}"
            class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 hover:border-blue-500 transition-all duration-300 flex flex-col items-center group">
            <span class="text-4xl mb-4 group-hover:scale-110 transition-transform">📊</span>
            <span class="font-bold text-slate-700 group-hover:text-blue-600">Tax Invoice</span>
        </a>

        <a href="{% url 'challan' %}"
            class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 hover:border-blue-500 transition-all duration-300 flex flex-col items-center group">
            <span class="text-4xl mb-4 group-hover:scale-110 transition-transform">📝</span>
            <span class="font-bold text-slate-700 group-hover:text-blue-600">Delivery Challan</span>
        </a>

        <a href="{% url 'attendance' %}"
            class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 hover:border-blue-500 transition-all duration-300 flex flex-col items-center group">
            <span class="text-4xl mb-4 group-hover:scale-110 transition-transform">⏰</span>
            <span class="font-bold text-slate-700 group-hover:text-blue-600">Attendance</span>
        </a>
    </div>
    <script src="{% static 'js/home.js' %}"></script>
</body>

</html>
